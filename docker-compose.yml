services:

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: YourStrongPassword
      MYSQL_DATABASE: rails_no_docker_development
      MYSQL_USER: rails
      MYSQL_PASSWORD: YourStrongPassword
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      DATABASE_USERNAME: rails
      DATABASE_PASSWORD: YourStrongPassword
      DATABASE_NAME: rails_no_docker_development
    volumes:
      - ./storage:/rails/storage
    command: bin/rails server -b 0.0.0.0 -p 3000

volumes:
  mysql_data: